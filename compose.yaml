# Local development only. Nothing is persisted: anvil and postgres start empty on every restart.
name: noaa-indexer

x-app: &app
  build: .
  image: noaa-indexer:local
  restart: on-failure
  environment:
    KV_VIPER_FILE: /shared/config.yaml
  volumes:
    - shared:/shared:ro

services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_USER: noaa
      POSTGRES_PASSWORD: noaa
      POSTGRES_DB: noaa
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "noaa"]
      interval: 2s
      retries: 30

  anvil:
    image: ghcr.io/foundry-rs/foundry:v1.7.1
    entrypoint: ["anvil", "--host", "0.0.0.0", "--block-time", "2"]
    ports:
      - "8545:8545"
    healthcheck:
      test:
        ["CMD", "cast", "block-number", "--rpc-url", "http://localhost:8545"]
      interval: 2s
      retries: 30

  deployer:
    image: ghcr.io/foundry-rs/foundry:v1.7.1
    user: root
    entrypoint: ["/bin/sh", "/deployer.sh"]
    environment:
      RPC_URL: http://anvil:8545
      DEPLOYER_PRIVATE_KEY: "0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80" # anvil account #0
      RECOVERY_DELAY: "60"
      CONTEST_LOCK: "2592000"
      DEPLOY_OUT: /shared/deploy.env
    volumes:
      - ./contracts:/contracts:ro
      - ./docker/deployer.sh:/deployer.sh:ro
      - ./docker/config.template.yaml:/config.template.yaml:ro
      - shared:/shared
    depends_on:
      anvil:
        condition: service_healthy

  migrate:
    <<: *app
    command: ["migrate", "up"]
    depends_on:
      postgres:
        condition: service_healthy
      deployer:
        condition: service_completed_successfully

  indexer:
    <<: *app
    command: ["run", "indexer"]
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  finalizer:
    <<: *app
    command: ["run", "finalizer"]
    ports:
      - "8001:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      mock-relayer:
        condition: service_started

  mock-relayer:
    build:
      context: .
      target: mockrelayer
    image: noaa-mockrelayer:local
    entrypoint:
      [
        "/bin/sh",
        "-c",
        ". /shared/deploy.env && MOCK_RELAYER_WHITELIST=$$NOAA_ADDRESS exec mockrelayer",
      ]
    environment:
      MOCK_RELAYER_ADDR: ":8080"
      MOCK_RELAYER_RPC: http://anvil:8545
      MOCK_RELAYER_PRIVATE_KEY: 59c6995e998f97a5a0044966f0945389dc9e86dae88c7a8412f4603b6b78690d # anvil account #1
    ports:
      - "8080:8080"
    volumes:
      - shared:/shared:ro
    depends_on:
      deployer:
        condition: service_completed_successfully

volumes:
  shared:
